name: Lexer up-to-date

on:
  push:
    branches: ['master', 'installPackage']
  pull_request:
  workflow_dispatch:

jobs:
  check-lexer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.6']
        julia-arch: ['x64']
        os: ['ubuntu-latest']

    steps:
      - uses: actions/checkout@v4

      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}

      - name: Cache Julia
        uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=bin/ -e 'using Pkg; Pkg.instantiate()'

      - name: Build Lexer
        run: julia --project=bin/ -e 'include("bin/generate_lexer.jl")'

      - name: Check for changes in src/lexer.jl
        id: changed-lexer
        uses: tj-actions/verify-changed-files@v20
        with:
          files: |
            src/lexer.jl

      - name: Archive changed lexer.jl
        if: steps.changed-lexer.outputs.files_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lexer.jl
          path: src/lexer.jl

      - name: Fail if lexer.jl isn't up-to-date
        if: steps.changed-lexer.outputs.files_changed == 'true'
        run: |
          echo "::error title=Lexer not up-to-date::Generated src/lexer.jl has uncommitted changes."
